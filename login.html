<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Aceh Discovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="aceh-theme">
    <nav class="navbar navbar-expand-lg fixed-top aceh-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                <div class="brand-icon"><i class="fa-solid fa-compass"></i></div>
                <span class="brand-text">Aceh Discovery</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center gap-lg-3 mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="kuliner.html">Kuliner</a></li>
                    <li class="nav-item"><a class="nav-link" href="budaya.html">Budaya & Tradisi</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinasi.html">Destinasi Wisata</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-aceh-outline text-decoration-none py-2 px-4" href="login.html">
                            <i class="fa-solid fa-user me-2"></i>Masuk
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5" style="max-width: 460px; margin-top: 70px;">
        <div class="filter-section">
            <h1 class="h3 fw-bold text-center mb-1 font-editorial text-teal">Selamat Datang</h1>
            <p class="text-muted text-center small mb-4">Masuk untuk memberi ulasan dan menyimpan favorit.</p>
            <ul class="nav nav-pills nav-fill mb-4 gap-2" id="tabAuth">
                <li class="nav-item"><button class="nav-link active rounded-pill" data-mode="masuk" type="button">Masuk</button></li>
                <li class="nav-item"><button class="nav-link rounded-pill" data-mode="daftar" type="button">Daftar</button></li>
            </ul>
            <form id="formAuth" novalidate>
                <div class="mb-3 d-none" id="grupNama"><label class="form-label fw-semibold" for="aNama">Nama</label><input id="aNama" class="form-control" autocomplete="name"></div>
                <div class="mb-3"><label class="form-label fw-semibold" for="aEmail">Email</label><input id="aEmail" type="email" class="form-control" autocomplete="email" required></div>
                <div class="mb-3"><label class="form-label fw-semibold" for="aSandi">Kata sandi</label><input id="aSandi" type="password" class="form-control" minlength="6" autocomplete="current-password" required></div>
                <div id="aPesan" class="small mb-3" role="alert"></div>
                <button class="btn btn-primary-custom w-100" id="aTombol" type="submit">Masuk</button>
            </form>
        </div>
    </main>
    <footer class="aceh-footer">
        <div class="container">
            <p class="mb-0 text-center small opacity-75">&copy; 2026 Bit2Bit. RPL Studio. Platform Eksplorasi Kuliner dan Budaya Lokal berbasis Web.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
