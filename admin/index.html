<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Aceh Discovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <i class="fa-solid fa-leaf text-success fs-3"></i>
                <span class="brand-font fs-4 text-success fw-bold">Aceh Discovery <span class="text-muted fs-6 fw-normal">/ Admin</span></span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="small text-muted" id="infoUser"></span>
                <a href="../index.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Lihat Situs</a>
                <button class="btn btn-sm btn-outline-danger rounded-pill px-3" id="btnKeluar">Keluar</button>
            </div>
        </div>
    </nav>

    <!-- Ditampilkan bila belum login / bukan admin -->
    <div class="container py-5 text-center d-none" id="aksesDitolak">
        <i class="fa-solid fa-lock fs-1 text-muted mb-3 d-block"></i>
        <h3 class="fw-bold">Akses Ditolak</h3>
        <p class="text-muted">Halaman ini hanya untuk admin. Silakan masuk dengan akun admin terlebih dahulu.</p>
        <a href="../login.html" class="btn btn-primary-custom rounded-pill px-4">Ke Halaman Masuk</a>
    </div>

    <div class="container-fluid d-none" id="dashboard">
        <div class="row">
            <!-- Sidebar -->
            <aside class="col-lg-2 admin-sidebar py-4">
                <nav class="nav flex-column gap-1" id="menuResource"></nav>
            </aside>

            <!-- Konten -->
            <main class="col-lg-10 py-4 px-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-0" id="judulResource">Data</h2>
                        <p class="text-muted small mb-0" id="deskResource"></p>
                    </div>
                    <button class="btn btn-primary-custom rounded-pill px-4" id="btnTambah"><i class="fa-solid fa-plus me-2"></i>Tambah Data</button>
                </div>

                <div class="custom-card-bg p-3">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0" id="tabelData">
                            <thead><tr id="theadRow"></tr></thead>
                            <tbody id="tbodyData"></tbody>
                        </table>
                    </div>
                    <p class="text-center text-muted py-4 d-none" id="tabelKosong">Belum ada data.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Form (dipakai ulang untuk semua jenis resource) -->
    <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4 border-0">
                <form id="formResource">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold text-success" id="judulModal">Tambah Data</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body row g-3" id="isiFormResource"></div>
                    <div class="modal-footer border-0 pt-0">
                        <span class="small text-danger me-auto" id="pesanForm"></span>
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary-custom rounded-pill px-4" id="btnSimpanForm">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/admin.js"></script>
</body>
</html>
